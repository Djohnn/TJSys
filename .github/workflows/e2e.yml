name: E2E
on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zyrp
          POSTGRES_USER: zyrp
          POSTGRES_PASSWORD: zyrp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend deps
        working-directory: ./backend
        run: |
          pip install -e .
          python manage.py migrate --noinput
          python manage.py seed_e2e

      - name: Start backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://zyrp:zyrp@localhost:5432/zyrp
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: ci-secret-key
          DEBUG: 'true'
          MONITORING_ENABLED: 'true'
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          sleep 3

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npx vite --host 0.0.0.0 --port 5173 &
          sleep 3

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8000/api/v1/health/ && break
            sleep 2
          done

      - name: Run Playwright E2E
        working-directory: ./frontend
        run: npx playwright test --reporter=html,json

      - name: Check Design Tokens
        working-directory: ./frontend
        run: node scripts/check-design-tokens.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
