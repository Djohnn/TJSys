name: E2E
on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tjsys
          POSTGRES_USER: tjsys
          POSTGRES_PASSWORD: tjsys
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend deps
        working-directory: ./backend
        env:
          POSTGRES_DB: tjsys
          POSTGRES_APP_USER: tjsys
          POSTGRES_APP_PASSWORD: tjsys
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: ci-secret-key
          DEBUG: 'true'
        run: |
          pip install -e .
          python manage.py migrate --noinput
          python manage.py seed_e2e

      - name: Start backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://tjsys:tjsys@localhost:5432/tjsys
          POSTGRES_DB: tjsys
          POSTGRES_APP_USER: tjsys
          POSTGRES_APP_PASSWORD: tjsys
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: ci-secret-key
          DEBUG: 'true'
          MONITORING_ENABLED: 'true'
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          sleep 3

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Start frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npx vite --host 0.0.0.0 --port 5174 &
          sleep 3

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/v1/health/; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed after 60 seconds"
          exit 1

      - name: Run Playwright E2E
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5174
          PLAYWRIGHT_RETRIES: '0'
          FRONTEND_BASE_URL: http://localhost:5174
          E2E_USER_EMAIL: web-admin@tjsys.local
          E2E_USER_PASSWORD: e2e-test-pwd-2026
          E2E_RECOVERY_CODE: e2e0000001
          E2E_ARTIFACT_PATH: ${{ github.workspace }}/test-results/product-pdv-flow.json
        run: npx playwright test --reporter=html,json

      - name: Install PDV deps and browsers
        working-directory: ./pdv
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run PDV vertical acceptance
        working-directory: ./pdv
        env:
          PLAYWRIGHT_RETRIES: '0'
          E2E_PDV_API_KEY: e2e-test-key-2026
          E2E_USER_EMAIL: web-admin@tjsys.local
          E2E_USER_PASSWORD: e2e-test-pwd-2026
          E2E_RECOVERY_CODE: e2e0000001
          E2E_ARTIFACT_PATH: ${{ github.workspace }}/test-results/product-pdv-flow.json
        run: npx playwright test e2e/product-stock-sale.spec.ts --reporter=html,json

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            pdv/playwright-report/
            test-results/
