name: E2E
on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.e2e
      DATABASE_URL: postgres://zyrp:zyrp@localhost:5432/zyrp
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: zyrp
      POSTGRES_APP_USER: zyrp
      POSTGRES_APP_PASSWORD: zyrp
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: e2e-secret-key-not-for-production
      E2E_SEED: '1'
      E2E_USER_EMAIL: web-admin@tjsys.local
      E2E_USER_PASSWORD: e2e-test-pwd-2026
      E2E_RECOVERY_CODE: e2e0000001
      AUTH_LOGIN_RATE: 100/minute
      AUTH_MFA_RATE: 100/minute
      VITE_API_BASE_URL: /api/v1
      DEBUG: 'true'
      MONITORING_ENABLED: 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zyrp
          POSTGRES_USER: zyrp
          POSTGRES_PASSWORD: zyrp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend deps
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://zyrp:zyrp@localhost:5432/zyrp
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: ci-secret-key
          DEBUG: 'true'
          SEED_ADMIN_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          pip install -e .
          python manage.py migrate --noinput
          python manage.py seed_e2e

      - name: Start backend
        working-directory: ./backend
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 >"$RUNNER_TEMP/e2e-backend.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/e2e-backend.pid"

      - name: Wait for backend health
        working-directory: ./backend
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health/; then
              exit 0
            fi
            sleep 2
          done
          echo 'Backend health check timed out after 60 seconds.'
          cat "$RUNNER_TEMP/e2e-backend.log"
          exit 1

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: ./frontend
        run: npx playwright test --project=chromium --reporter=html,json

      - name: Install PDV deps and browsers
        working-directory: ./pdv
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run PDV vertical acceptance
        working-directory: ./pdv
        env:
          PLAYWRIGHT_RETRIES: '0'
          E2E_PDV_API_KEY: ${{ secrets.E2E_PDV_API_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ADMIN_RECOVERY_CODE: ${{ secrets.E2E_ADMIN_RECOVERY_CODE }}
          E2E_ARTIFACT_PATH: ${{ github.workspace }}/test-results/product-pdv-flow.json
        run: |
          npm run typecheck:e2e
          npx playwright test e2e/product-stock-sale.spec.ts --reporter=html,json

      - name: Check Design Tokens
        working-directory: ./frontend
        run: node scripts/check-design-tokens.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            pdv/playwright-report/
            test-results/product-pdv-flow.json
