name: E2E
on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zyrp
          POSTGRES_USER: zyrp
          POSTGRES_PASSWORD: zyrp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend deps
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://zyrp:zyrp@localhost:5432/zyrp
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: ci-secret-key
          DEBUG: 'true'
          SEED_ADMIN_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          pip install -e .
          python manage.py migrate --noinput
          python manage.py seed_e2e

      - name: Start backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://zyrp:zyrp@localhost:5432/zyrp
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: ci-secret-key
          DEBUG: 'true'
          MONITORING_ENABLED: 'true'
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          sleep 3

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npx vite --host 0.0.0.0 --port 5173 &
          sleep 3

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8000/api/v1/health/ && break
            sleep 2
          done

      - name: Run Playwright E2E
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5174
          PLAYWRIGHT_RETRIES: '0'
          FRONTEND_BASE_URL: http://localhost:5174
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_RECOVERY_CODE: ${{ secrets.E2E_RECOVERY_CODE }}
          E2E_ADMIN_RECOVERY_CODE: ${{ secrets.E2E_ADMIN_RECOVERY_CODE }}
          E2E_ARTIFACT_PATH: ${{ github.workspace }}/test-results/product-pdv-flow.json
        run: |
          npm run typecheck:e2e
          npx playwright test e2e/product-pdv-stock-flow.spec.ts --project=chromium --reporter=html,json

      - name: Install PDV deps and browsers
        working-directory: ./pdv
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run PDV vertical acceptance
        working-directory: ./pdv
        env:
          PLAYWRIGHT_RETRIES: '0'
          E2E_PDV_API_KEY: ${{ secrets.E2E_PDV_API_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ADMIN_RECOVERY_CODE: ${{ secrets.E2E_ADMIN_RECOVERY_CODE }}
          E2E_ARTIFACT_PATH: ${{ github.workspace }}/test-results/product-pdv-flow.json
        run: |
          npm run typecheck:e2e
          npx playwright test e2e/product-stock-sale.spec.ts --reporter=html,json

      - name: Run R0-R2 visual regression
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5174
          PLAYWRIGHT_RETRIES: '0'
        run: |
          npx playwright test e2e/r0-baseline-e-governanca-do-design-system.spec.ts e2e/r1-tokens-e-componentes-fundamentais.spec.ts e2e/r2-shell-navegacao-e-responsividade.spec.ts --project=chromium --retries=0

      - name: Run R3 catalog acceptance and accessibility
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5174
          PLAYWRIGHT_RETRIES: '0'
          FRONTEND_BASE_URL: http://localhost:5174
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_RECOVERY_CODE: ${{ secrets.E2E_RECOVERY_CODE }}
          E2E_ADMIN_RECOVERY_CODE: ${{ secrets.E2E_ADMIN_RECOVERY_CODE }}
        run: |
          npx playwright test e2e/catalog-sprints-23-30.spec.ts e2e/accessibility.spec.ts --project=chromium --retries=0

      - name: Run R4 product pricing vertical acceptance
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5174
          PLAYWRIGHT_RETRIES: '0'
          FRONTEND_BASE_URL: http://localhost:5174
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_RECOVERY_CODE: ${{ secrets.E2E_RECOVERY_CODE }}
          E2E_ADMIN_RECOVERY_CODE: ${{ secrets.E2E_ADMIN_RECOVERY_CODE }}
        run: |
          npm run typecheck:e2e
          npx playwright test e2e/r4-produto-custo-varejo-atacado-e-margens.spec.ts --project=chromium --retries=0 --reporter=html,json

      - name: Check Design Tokens
        working-directory: ./frontend
        run: node scripts/check-design-tokens.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            pdv/playwright-report/
            test-results/product-pdv-flow.json
