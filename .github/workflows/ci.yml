name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: '3.13'
  DJANGO_SETTINGS_MODULE: config.settings.test
  DB_NAME: zyrp_test
  DB_USER: zyrp
  DB_PASSWORD: zyrp
  DB_HOST: localhost
  DB_PORT: 5432
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz-ABCDE
  DEBUG: 'False'
  ALLOWED_HOSTS: localhost
  POSTGRES_DB: zyrp_test
  POSTGRES_USER: zyrp
  POSTGRES_PASSWORD: zyrp
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_APP_USER: zyrp_app
  POSTGRES_APP_PASSWORD: zyrp_app_ci
  POSTGRES_TEST_USER: zyrp_test
  POSTGRES_TEST_PASSWORD: zyrp_test_ci
  POSTGRES_TEST_DB: test_zyrp
  CELERY_BROKER_URL: redis://localhost:6379/1
  CELERY_RESULT_BACKEND: redis://localhost:6379/1
  EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
  EMAIL_HOST: localhost
  EMAIL_HOST_USER: ci-user
  EMAIL_HOST_PASSWORD: ci-only-placeholder
  E2E_RECOVERY_CODE: ${{ secrets.E2E_RECOVERY_CODE }}
  AUTH_LOGIN_RATE: 1000/minute
  AUTH_MFA_RATE: 1000/minute

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zyrp_test
          POSTGRES_USER: zyrp
          POSTGRES_PASSWORD: zyrp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate ephemeral MFA encryption key
        run: python -c "from cryptography.fernet import Fernet; print('MFA_ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"

      - name: Bootstrap unprivileged database roles
        run: bash ../infra/postgres/init/001_roles.sh

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy .

      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --settings=config.settings.migration

      - name: Verify migrations applied
        run: python manage.py migrate --check --settings=config.settings.migration

      - name: Run tests
        run: python -m pytest -v

      - name: Security check (pip-audit)
        run: |
          python -m pip freeze --exclude-editable > /tmp/requirements-audit.txt
          pip-audit --strict --requirement /tmp/requirements-audit.txt

      - name: Secrets detection
        run: |
          cd ..
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Deploy check
        run: python manage.py check --deploy --settings=config.settings.production

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Generate API schema (mock for CI)
        run: npx openapi-typescript http://localhost:8000/api/v1/schema/ -o /dev/null || echo "⚠️ Backend not reachable in CI; skipping schema generation"
        working-directory: frontend

      - name: Lint (eslint)
        run: npm run lint
        working-directory: frontend

      - name: Type check (tsc)
        run: npm run typecheck
        working-directory: frontend

      - name: Unit tests (vitest)
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  playwright:
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zyrp_test
          POSTGRES_USER: zyrp
          POSTGRES_PASSWORD: zyrp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: backend

      - name: Generate ephemeral MFA encryption key
        run: python -c "from cryptography.fernet import Fernet; print('MFA_ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"

      - name: Bootstrap unprivileged database roles
        run: bash ../infra/postgres/init/001_roles.sh
        working-directory: backend

      - name: Run migrations
        run: python manage.py migrate --settings=config.settings.migration
        working-directory: backend

      - name: Seed E2E data
        run: python manage.py seed_e2e
        working-directory: backend
        env:
          SEED_ADMIN_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Start backend
        run: python manage.py runserver 0.0.0.0:8000 --settings=config.settings.local > /tmp/tjsys-backend.log 2>&1 &
        working-directory: backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/v1/health/; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed after 60 seconds"
          cat /tmp/tjsys-backend.log
          exit 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check API schema matches generated types
        run: npm run api:generate && npm run api:check
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
          PLAYWRIGHT_BASE_URL: http://localhost:5174
          PLAYWRIGHT_RETRIES: '0'
          FRONTEND_BASE_URL: http://localhost:5174
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_RECOVERY_CODE: ${{ secrets.E2E_RECOVERY_CODE }}
          E2E_ADMIN_RECOVERY_CODE: ${{ secrets.E2E_ADMIN_RECOVERY_CODE }}
