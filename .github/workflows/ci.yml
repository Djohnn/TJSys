name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: '3.13'
  DJANGO_SETTINGS_MODULE: config.settings.test
  DB_NAME: zyrp_test
  DB_USER: zyrp
  DB_PASSWORD: zyrp
  DB_HOST: localhost
  DB_PORT: 5432
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz-ABCDE
  DEBUG: 'False'
  ALLOWED_HOSTS: localhost
  POSTGRES_DB: zyrp_test
  POSTGRES_USER: zyrp
  POSTGRES_PASSWORD: zyrp
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_APP_USER: zyrp_app
  POSTGRES_APP_PASSWORD: zyrp_app_ci
  POSTGRES_TEST_USER: zyrp_test
  POSTGRES_TEST_PASSWORD: zyrp_test_ci
  POSTGRES_TEST_DB: test_zyrp
  CELERY_BROKER_URL: redis://localhost:6379/1
  CELERY_RESULT_BACKEND: redis://localhost:6379/2
  EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
  EMAIL_HOST: localhost
  EMAIL_HOST_USER: ci-user
  EMAIL_HOST_PASSWORD: ci-only-placeholder

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zyrp_test
          POSTGRES_USER: zyrp
          POSTGRES_PASSWORD: zyrp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate ephemeral MFA encryption key
        run: python -c "from cryptography.fernet import Fernet; print('MFA_ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"

      - name: Bootstrap unprivileged database roles
        run: bash ../infra/postgres/init/001_roles.sh

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy .

      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --settings=config.settings.migration

      - name: Verify migrations applied
        run: python manage.py migrate --check --settings=config.settings.migration

      - name: Run tests
        run: python -m pytest -v

      - name: Security check (pip-audit)
        run: |
          python -m pip freeze --exclude-editable > /tmp/requirements-audit.txt
          pip-audit --strict --requirement /tmp/requirements-audit.txt

      - name: Secrets detection
        run: |
          cd ..
          status=0
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline || status=$?
          if ! git diff --quiet -- .secrets.baseline; then
            git diff -- .secrets.baseline
          fi
          exit "$status"

      - name: Deploy check
        run: python manage.py check --deploy --settings=config.settings.production

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Generate API schema (mock for CI)
        run: npx openapi-typescript http://localhost:8000/api/v1/schema/ -o /dev/null || echo "⚠️ Backend not reachable in CI; skipping schema generation"
        working-directory: frontend

      - name: Lint (eslint)
        run: npm run lint
        working-directory: frontend

      - name: Type check (tsc)
        run: npm run typecheck
        working-directory: frontend

      - name: Unit tests (vitest)
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  playwright:
    runs-on: ubuntu-latest
    needs: ci
    env:
      DJANGO_SETTINGS_MODULE: config.settings.e2e
      DB_NAME: zyrp
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: zyrp
      POSTGRES_APP_USER: zyrp
      POSTGRES_APP_PASSWORD: zyrp
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: e2e-secret-key-not-for-production
      E2E_SEED: '1'
      E2E_USER_EMAIL: web-admin@tjsys.local
      E2E_USER_PASSWORD: e2e-test-pwd-2026
      E2E_RECOVERY_CODE: e2e0000001
      AUTH_LOGIN_RATE: 100/minute
      AUTH_MFA_RATE: 100/minute
      VITE_API_BASE_URL: /api/v1
      DEBUG: 'true'
      MONITORING_ENABLED: 'true'
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zyrp
          POSTGRES_USER: zyrp
          POSTGRES_PASSWORD: zyrp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate ephemeral MFA encryption key
        working-directory: backend
        run: python -c "from cryptography.fernet import Fernet; print('MFA_ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"

      - name: Bootstrap unprivileged database roles
        working-directory: backend
        env:
          POSTGRES_APP_USER: zyrp_app
          POSTGRES_APP_PASSWORD: zyrp_app_ci
        run: bash ../infra/postgres/init/001_roles.sh

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --settings=config.settings.migration

      - name: Seed E2E data
        working-directory: backend
        run: python manage.py seed_e2e
        env:
          POSTGRES_APP_USER: zyrp
          POSTGRES_APP_PASSWORD: zyrp
          SEED_ADMIN_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || env.E2E_USER_PASSWORD }}

      - name: Start E2E backend
        working-directory: backend
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 --settings=config.settings.e2e >"$RUNNER_TEMP/e2e-backend.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/e2e-backend.pid"
        env:
          POSTGRES_APP_USER: zyrp_app
          POSTGRES_APP_PASSWORD: zyrp_app_ci

      - name: Wait for E2E backend health
        working-directory: backend
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health/; then
              exit 0
            fi
            sleep 2
          done
          echo 'Backend health check timed out after 60 seconds.'
          cat "$RUNNER_TEMP/e2e-backend.log"
          exit 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check API schema matches generated types
        run: npm run api:generate && npm run api:check
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        run: npm run test:e2e

  pdv-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdv

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pdv/package-lock.json

      - name: Install PDV dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Type check E2E
        run: npm run typecheck:e2e

      - name: Run PDV mock E2E
        run: npm run test:e2e -- --project=chromium-mock --retries=0

      - name: Upload PDV Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdv-playwright-report
          path: |
            pdv/playwright-report/
            pdv/test-results/
          if-no-files-found: ignore
