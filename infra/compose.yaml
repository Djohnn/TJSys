services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tjsys}
      POSTGRES_USER: ${POSTGRES_USER:-tjsys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tjsys}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-tjsys_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-tjsys_app_dev}
      POSTGRES_TEST_USER: ${POSTGRES_TEST_USER:-tjsys_test}
      POSTGRES_TEST_PASSWORD: ${POSTGRES_TEST_PASSWORD:-tjsys_test_dev}
    ports:
      - '127.0.0.1:${POSTGRES_EXTERNAL_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tjsys} -d ${POSTGRES_DB:-tjsys}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - tjsys-local

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${REDIS_EXTERNAL_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - tjsys-local

volumes:
  postgres-data:
  redis-data:

networks:
  tjsys-local:
    driver: bridge
